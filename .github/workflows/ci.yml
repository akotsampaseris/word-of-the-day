# Checks every push to main and every pull request (including the drafts PR,
# if it was opened with a personal access token; see README "CI setup").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in package.json's "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Fails if any content file is invalid, including failed drafts that
      # still carry "_errors", so they cannot be merged by accident.
      - run: pnpm pipeline:validate
      - run: pnpm build
